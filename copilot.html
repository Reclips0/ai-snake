<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 5px;
    }

    #info {
      margin-bottom: 10px;
      font-size: 14px;
      color: #aaa;
    }

    #score {
      margin-bottom: 10px;
      font-size: 16px;
    }

    canvas {
      border: 2px solid #444;
      background: #000;
    }

    #game-over {
      margin-top: 10px;
      color: #f55;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div id="info">Use arrow keys or WASD to move. Press Space to restart.</div>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="game-over">Game Over! Press Space to play again.</div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const gameOverEl = document.getElementById("game-over");

    const tileSize = 20;
    const tileCount = canvas.width / tileSize;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let gameOver;
    let gameLoopId;

    function initGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = randomFoodPosition();
      score = 0;
      gameOver = false;
      scoreEl.textContent = "Score: " + score;
      gameOverEl.style.display = "none";

      if (gameLoopId) {
        clearInterval(gameLoopId);
      }
      gameLoopId = setInterval(gameLoop, 120);
    }

    function randomFoodPosition() {
      let newPos;
      while (true) {
        newPos = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        if (!snake.some(seg => seg.x === newPos.x && seg.y === newPos.y)) {
          return newPos;
        }
      }
    }

    function gameLoop() {
      if (gameOver) return;

      direction = nextDirection;

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Wall collision
      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Food collision
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = "Score: " + score;
        food = randomFoodPosition();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw food
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize, tileSize);

      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? "#2ecc71" : "#27ae60";
        ctx.fillRect(
          snake[i].x * tileSize,
          snake[i].y * tileSize,
          tileSize - 1,
          tileSize - 1
        );
      }
    }

    function endGame() {
      gameOver = true;
      gameOverEl.style.display = "block";
      clearInterval(gameLoopId);
    }

    function setDirection(dx, dy) {
      // Prevent reversing directly
      if (dx === -direction.x && dy === -direction.y) return;
      nextDirection = { x: dx, y: dy };
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "w") setDirection(0, -1);
      else if (e.key === "ArrowDown" || e.key === "s") setDirection(0, 1);
      else if (e.key === "ArrowLeft" || e.key === "a") setDirection(-1, 0);
      else if (e.key === "ArrowRight" || e.key === "d") setDirection(1, 0);
      else if (e.key === " " && gameOver) initGame();
    });

    // Start the game
    initGame();
  </script>
</body>
</html>
